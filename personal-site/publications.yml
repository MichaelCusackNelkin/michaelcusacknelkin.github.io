- title: "Adaptive Execution Strategies Lead to Robust Improvements Over Naive Benchmark"
  path: publications/saf_whitepaper.pdf
  author: "Michael Cusack-Nelkin"
  date: "2026-06-26"
  description: >
    Designed an adaptive execution strategy using L2 order book data and an
    execution simulator to test it. The simulator can simulate the fills and
    impact of any generic fill strategy using market orders, resting limit
    orders, and IOC limit orders in the presence of variable latency and book
    resilience (modeled as a Poisson process). The final strategy offered large
    improvements over naive strategies, using microstructure signals to adapt
    fill aggression.
  categories: [Market Microstructure, Execution]

- title: "High Sharpe, Low Capacity: Optimally Trading the Nasdaq Closing Auction Imbalance"
  path: publications/auction_whitepaper.pdf
  author: "Michael Cusack-Nelkin"
  date: "2026-05-01"
  description: >
    Built and backtested a statistical arbitrage system around the Nasdaq closing auction imbalance
    based on single-period optimization with an alpha forecast, covariance model, 
    and instantaneous impact model. The forecast holds a 29% out-of-sample rank IC through 
    rolling cross-validation, and the strategy backtests to a Sharpe of 8.44 at $60M
    GMV. The strategy is subject to tight capacity and latency limits that make it 
    best suited to an execution pipeline serving a larger portfolio.
  categories: [Auction Imbalance, Portfolio Optimization, Capacity Estimation]
